<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WishList · Flujos del MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Página contenedora: un solo teléfono 390×844 centrado, notas de privacidad al lado. */
:root{
  --bg:#EFEEEA; --fg:#17181B; --muted:#5B5E66; --line:#D6D4CE;
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151518;--fg:#ECEDEF;--muted:#A3A6AE;--line:#2E3036;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151518;--fg:#ECEDEF;--muted:#A3A6AE;--line:#2E3036;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ui)}
.page{max-width:980px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.intro{text-align:center;display:flex;flex-direction:column;gap:4px}
.intro h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.intro p{margin:0;color:var(--muted);font-size:14px}
.stage{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%}
.notes{max-width:250px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px;padding-top:12px}
.notes h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
@media (max-width:760px){.notes{max-width:390px;padding-top:0}}

/* Marco de teléfono */
.phone{position:relative;width:min(390px,100%);height:844px;border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #0E0F12,0 0 0 11px #2A2C31,0 30px 60px -20px rgba(0,0,0,.4);background:var(--p-bg);color:var(--ink);isolation:isolate;margin:11px}
.status{position:absolute;inset:0 0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 15px/1 var(--ui);z-index:6;background:var(--p-bg);color:var(--ink)}
.status .isl{position:absolute;left:50%;top:11px;width:122px;height:34px;margin-left:-61px;border-radius:20px;background:#000}
.status .sig{display:flex;gap:6px;align-items:center}
.status .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative}
.status .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1.5px}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:50px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:8}
.toast{position:absolute;left:20px;right:20px;bottom:110px;z-index:9;background:var(--ink);color:#fff;font:500 13.5px/1.35 var(--ui);padding:12px 14px;border-radius:14px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.phone ul{list-style:none;margin:0;padding:0}
.phone button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.phone h1,.phone h2,.phone p{margin:0}
.phone svg{flex:none}
.phone :focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== A refinada · minimalismo cálido =====
   Cobalto = acción y estado · Naranja = ocasiones y celebraciones · Morado = grupos, votos y lo compartido */
.va{
  --p-bg:#FFFFFF; --ink:#15172A; --mut:#5E6070; --line:#ECEAE5; --surf:#F7F6F3;
  --cobalt:#2346D8; --cobalt-soft:#EEF1FD;
  --purple:#8B5CF6; --purple-ink:#6D3FD9; --purple-soft:#F4EFFF;
  --orange:#FB923C; --orange-ink:#B5440F; --orange-soft:#FFF2E7;
  font-family:"Geist",system-ui,sans-serif;
}
.va .scr{padding:6px 22px 124px;display:flex;flex-direction:column;gap:34px}
.va .sec{display:flex;flex-direction:column;gap:12px}
.va .sh{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.va h2{font-size:16px;font-weight:600;letter-spacing:-.015em;display:flex;gap:8px;align-items:center}
.va .more{font-size:13.5px;color:var(--cobalt);font-weight:500;min-height:44px;display:flex;align-items:center}

/* Saludo */
.va .hello{display:flex;flex-direction:column;gap:2px}
.va .topline{display:flex;justify-content:space-between;align-items:center}
.va .date{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.va .date::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.va .av{width:44px;height:44px;border-radius:50%;background:var(--purple-soft);color:var(--purple-ink);display:grid;place-items:center;font-size:14px;font-weight:600}
.va .greet{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:4px}
.va h1{font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.05;padding-bottom:12px}
.va h1 .name{position:relative;display:inline-block}
.va h1 .name svg{position:absolute;left:-2px;right:-4px;bottom:-9px;width:calc(100% + 6px);height:12px}
.va .mascot{width:104px;height:104px;margin-right:-8px;margin-bottom:-6px}

/* Avisos */
.va .alerts{display:flex;flex-direction:column;gap:8px}
.va .alert{display:flex;gap:14px;align-items:center;width:100%;padding:14px 14px 14px 12px;min-height:72px;border-radius:18px;background:var(--surf)}
.va .alert.first{background:var(--orange-soft)}
.va .alert .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--orange-ink)}
.va .alert.first .ico{background:transparent}
.va .alert .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.va .alert .when{font-size:12px;font-weight:600;color:var(--orange-ink)}
.va .alert strong{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.va .alert .s{font-size:13px;color:var(--mut)}
.va .alert .chev{color:var(--mut)}

/* Filas genéricas */
.va .rows li+li{border-top:1px solid var(--line)}
.va .row{display:flex;gap:14px;align-items:center;width:100%;padding:13px 0;min-height:64px}
.va .row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.va .row .t{font-size:15px;font-weight:500;letter-spacing:-.005em}
.va .row .s{font-size:13px;color:var(--mut)}
.va .tile{width:42px;height:42px;border-radius:13px;background:var(--surf);display:grid;place-items:center;color:var(--ink);flex:none}

/* Votos */
.va .count{font-size:12px;font-weight:600;background:var(--purple-ink);color:#fff;border-radius:10px;padding:1px 8px}
.va .vote .tile{background:var(--purple-soft);color:var(--purple-ink)}
.va .vote .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--purple-ink);font-weight:600}
.va .vote .t{font-size:14.5px}

/* Regalos que organizas */
.va .gift .tile{background:var(--cobalt-soft);color:var(--cobalt)}
.va .pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center;background:var(--cobalt-soft);color:var(--cobalt)}
.va .pill.bought{background:var(--ink);color:#fff}
.va .meter{height:6px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.va .meter i{display:block;height:100%;background:var(--cobalt);border-radius:3px}
.va .meter-l{font-size:12px;color:var(--mut);margin-top:3px}
.va .colab-tag{display:inline-flex;align-self:flex-start;font-size:11px;font-weight:600;color:var(--purple-ink);background:var(--purple-soft);border-radius:6px;padding:2px 7px;margin-top:4px}

/* Próximas ocasiones: línea de tiempo */
.va .occ-h .dots{display:inline-flex;gap:3px}
.va .occ-h .dots i{width:5px;height:5px;border-radius:50%}
.va .tl{position:relative}
.va .tl::before{content:"";position:absolute;left:22px;top:30px;bottom:30px;border-left:2px dotted #E2DED6}
.va .tl li{position:relative}
.va .occ{display:flex;gap:14px;align-items:center;width:100%;padding:8px 0;min-height:68px}
.va .cal{position:relative;z-index:1;width:46px;height:52px;border-radius:14px;background:var(--orange-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none;box-shadow:0 0 0 4px #fff}
.va .cal b{font-size:20px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.va .cal span{font-size:10.5px;font-weight:600;color:var(--orange-ink);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.va .occ .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.va .occ .t{font-size:15px;font-weight:500}
.va .occ .s{font-size:13px;color:var(--mut)}
.va .left{font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums;padding:4px 9px;border-radius:999px;background:var(--surf)}
.va .left.soon{background:var(--orange-soft);color:var(--orange-ink)}
.va .occ.own{background:var(--purple-soft);border-radius:18px;padding:8px 10px 8px 0;margin:4px 0;width:100%}
.va .occ.own .cal{background:#fff;box-shadow:0 0 0 4px var(--purple-soft)}
.va .occ.own .cal span{color:var(--purple-ink)}
.va .occ.own .left{background:#fff}
.va .lock{font-size:12px;font-weight:500;color:var(--purple-ink);display:flex;gap:4px;align-items:center}

/* Mis listas */
.va .lists{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.va .lcard{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:132px}
.va .lcard b{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1}
.va .lcard b small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--mut);margin-left:4px}
.va .lcard .t{font-size:14.5px;font-weight:600;display:block}
.va .tag{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;margin-top:6px}
.va .tag.shared{background:var(--purple-soft);color:var(--purple-ink)}
.va .tag.priv{background:var(--surf);color:var(--mut)}
.va .add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%!important;text-align:center!important;min-height:52px;border-radius:16px;background:var(--cobalt)!important;color:#fff!important;font-weight:600!important;font-size:15px}

/* Mis grupos */
.va .grp-h{display:flex;justify-content:space-between;align-items:flex-end}
.va .friends{width:104px;height:62px;margin-bottom:-4px}
.va .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px}
.va .chips::-webkit-scrollbar{display:none}
.va .chip{border:1px solid var(--line);border-radius:999px;padding:0 14px 0 5px;min-height:46px;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;white-space:nowrap}
.va .chip i{width:34px;height:34px;border-radius:50%;background:var(--purple-soft);color:var(--purple-ink);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
.va .chip span{color:var(--mut);font-weight:400}

/* Navegación */
.va .nav{position:absolute;inset:auto 0 0;z-index:7;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 26px}
.va .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--mut);min-height:52px;justify-content:center;text-align:center}
.va .nav button .pi{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.va .nav button[aria-current="page"]{color:var(--cobalt);font-weight:600}
.va .nav button[aria-current="page"] .pi{background:var(--cobalt-soft)}
:root{--seg:#FFFFFF;--seg-on:#17181B;--seg-on-fg:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--seg:#202227;--seg-on:#ECEDEF;--seg-on-fg:#141518}}
:root[data-theme="dark"]{--seg:#202227;--seg-on:#ECEDEF;--seg-on-fg:#141518}

/* ===== Pantallas nuevas: mismo sistema .va ===== */
.seg{display:flex;gap:4px;background:var(--seg);border:1px solid var(--line);border-radius:14px;padding:4px;flex-wrap:wrap;justify-content:center;max-width:100%}
.seg button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--fg);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-fg)}
.seg button:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}
.seg.small button{font-size:13px;padding:8px 12px;min-height:40px}
.caption{margin:0;color:var(--muted);font-size:13.5px;text-align:center;max-width:52ch;text-wrap:balance}

.va .scr.sub{gap:26px;padding-bottom:130px}
.va .scr.withbar{padding-bottom:250px}
.va .appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding-top:4px}
.va .back{width:44px;height:44px;border-radius:14px;background:var(--surf);display:grid;place-items:center}
.va .appbar .ttl{flex:1;font-size:15px;font-weight:600;text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.va .appbar .ghost{width:44px}
.va h1.plain{padding-bottom:0;font-size:28px;letter-spacing:-.03em}
.va .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.va .mt{display:flex;flex-direction:column;gap:6px}
.va .sub-t{font-size:14px;color:var(--mut);line-height:1.4}
.va .tags{display:flex;gap:6px;flex-wrap:wrap}
.va .mtag{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.va .mtag.o{background:var(--orange-soft);color:var(--orange-ink)}
.va .mtag.p{background:var(--purple-soft);color:var(--purple-ink)}
.va .mtag.n{background:var(--surf);color:var(--mut)}
.va .privacy{display:flex;gap:10px;align-items:flex-start;background:var(--purple-soft);color:var(--purple-ink);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:500;line-height:1.45}
.va .privacy svg{margin-top:1px}

/* Persona */
.va .person{display:flex;gap:14px;align-items:center}
.va .pav{width:64px;height:64px;border-radius:22px;background:var(--orange-soft);color:var(--orange-ink);font-size:22px;font-weight:600;display:grid;place-items:center;flex:none;position:relative}
.va .pav svg{position:absolute;right:-14px;top:-18px}
.va .person .full{font-size:13px;color:var(--mut)}

/* Deseos */
.va .summary{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.va .summary b{color:var(--ink);font-weight:600}
.va .wishes li+li{border-top:1px solid var(--line)}
.va .wish{display:flex;gap:14px;align-items:flex-start;width:100%;padding:16px 0;min-height:64px}
.va .wtile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--orange-soft);color:var(--orange-ink)}
.va .wish.off .wtile{background:var(--surf);color:var(--mut)}
.va .wish .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.va .wish .t{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.va .wish .d{font-size:13px;color:var(--mut);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.va .wish .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.va .price{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.va .price small{font-size:12px;font-weight:500;color:var(--mut);margin-left:3px}
.va .price.none{font-size:13px;font-weight:500;color:var(--mut)}
.va .avail{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.va .avail.free{background:#E7F5EE;color:#0E6640}
.va .avail.free::before{content:"";width:7px;height:7px;border-radius:50%;background:#16A36A}
.va .avail.mine{background:var(--cobalt-soft);color:var(--cobalt)}
.va .avail.taken{background:var(--surf);color:var(--mut)}

/* Detalle */
.va .hero{position:relative;background:var(--orange-soft);border-radius:26px;height:196px;display:grid;place-items:center;overflow:hidden}
.va .hero .dot{position:absolute;border-radius:50%}
.va .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.va .fact{border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.va .fact .l{font-size:12px;color:var(--mut);font-weight:500}
.va .fact .v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.va .fact .v small{font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
.va .desc{font-size:15px;line-height:1.55;color:#33354A}
.va .lrow{display:flex;gap:14px;align-items:center;width:100%;padding:12px 14px 12px 12px;border-radius:18px;background:var(--surf);min-height:64px}
.va .lrow .tile{background:#fff}
.va .lrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.va .lrow .l{font-size:12px;color:var(--mut);font-weight:500}
.va .lrow .v{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.va .lrow .go{color:var(--cobalt)}
.va .actbar{position:absolute;left:0;right:0;bottom:84px;z-index:7;background:#fff;border-top:1px solid var(--line);padding:12px 22px 14px;display:flex;flex-direction:column;gap:6px}
.va .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%!important;text-align:center!important;min-height:52px;border-radius:16px;font-weight:600!important;font-size:15px}
.va .btn.pri{background:var(--cobalt)!important;color:#fff!important}
.va .btn.sec2{border:1.5px solid var(--line)!important;color:var(--ink)!important;min-height:48px}
.va .btn.txt{color:var(--cobalt)!important;min-height:44px;font-size:14px}
.va .btn.txt.mutd{color:var(--mut)!important}
.va .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Pasos de estado */
.va .steps{display:grid;grid-template-columns:repeat(3,1fr);position:relative;margin-top:4px}
.va .steps::before{content:"";position:absolute;left:16.6%;right:16.6%;top:11px;height:2px;background:var(--line)}
.va .steps .fill{position:absolute;left:16.6%;top:11px;height:2px;background:var(--cobalt)}
.va .step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:500}
.va .step i{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.va .step.on{color:var(--ink);font-weight:600}
.va .step.on i{background:var(--cobalt);border-color:var(--cobalt)}
.va .card{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.va .card .ch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.va .card .ch .l{font-size:13px;color:var(--mut);font-weight:500}

/* Colaborativo */

/* ===== Mapa de pantallas ===== */
const SECS=[
  {t:"Grupos",s:[["G1","Mis grupos"],["G2","Detalle de grupo"],["G3","Votación de ingreso"],["G4","Crear o unirse"]]},
  {t:"Mis listas",s:[["L1","Listas propias"],["L2","Detalle de lista"],["L3","Crear deseo"],["L4","Editar y compartir lista"]]},
  {t:"Ocasiones",s:[["O1","Próximas"],["O2","Detalle de ocasión"],["O3","Nueva ocasión"]]},
  {t:"Regalos",s:[["R1","Organizo"],["R2","Recibidos"],["R3","Realizados"]]},
  {t:"Acceso y perfil",s:[["A1","Inicio de sesión"],["A2","Registro"],["A3","Verificar correo"],["A4","Perfil"]]}
];
const FN={G1,G2,G3,G4,L1,L2,L3,L4,O1,O2,O3,R1,R2,R3,A1,A2,A3,A4};
const RULES={
  G1:["Cada grupo muestra nombre e integrantes.","Las solicitudes por votar se marcan en morado."],
  G2:["Integrantes con apodo y nombre completo; solo día y mes de cumpleaños.","La invitación no da acceso: cada solicitud se vota.","Salir del grupo pide confirmación antes de ejecutarse."],
  G3:["Mayoría absoluta de integrantes activos: floor(8/2)+1 = 5.","La abstención no cuenta como voto en contra.","La solicitante no ve información privada del grupo."],
  G4:["Crear un grupo solo pide el nombre.","El solicitante ve el estado de su solicitud y puede retirarla."],
  L1:["Las listas nuevas son privadas.","Las archivadas se pueden restaurar y no admiten reservas nuevas.","El propietario nunca ve reservas."],
  L2:["Solo estado personal: pendiente o cumplido.","«Marcar recibido» lo hace solo el propietario."],
  L3:["Mismos campos aprobados: nombre, descripción, imagen, precio, enlace y lista.","La vista previa muestra lo que verán los grupos, sin datos de reserva.","Ejemplo de error de validación en el enlace."],
  L4:["Solo grupos con membresía activa.","Compartir no crea copias.","Eliminar solo si no hay reservas ni propuestas activas."],
  O1:["Avisos internos a 14 y 7 días.","Tu cumpleaños y Navidad sin datos de organización."],
  O2:["Solo quien la creó puede editarla o cancelarla.","Los destinatarios no ven lo que se organiza para ellos."],
  O3:["Mismos campos aprobados, agrupados: celebración, destinatarios y repetición.","Los cumpleaños no se crean a mano."],
  R1:["Conciliación privada al confirmar la recepción.","Compra declarada no equivale a regalo realizado."],
  R2:["Solo lo ve su dueña.","No muestra quién regaló."],
  R3:["Solo entregas confirmadas.","Filtro por destinatario."],
  A1:["El error no revela si existe una cuenta con ese correo."],
  A2:["Campos de RF-AUTH-01. Año de nacimiento opcional y privado."],
  A3:["Sin verificar no se puede crear ni unirse a grupos."],
  A4:["Correo y año: solo tú. Nombre, apodo y cumpleaños: tus grupos.","Sin imagen de perfil: queda fuera del MVP."]
};

const panel=document.getElementById('panel'), secsEl=document.getElementById('secs'), scrEl=document.getElementById('scr'), notes=document.getElementById('notes'), nTitle=document.getElementById('nTitle'), errSeg=document.getElementById('errSeg');
let cur='G1', tt;
const secOf=id=>SECS.find(s=>s.s.some(x=>x[0]===id));
const nameOf=id=>secOf(id).s.find(x=>x[0]===id)[1];
function toast(m){const t=panel.querySelector('.toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900);}
function go(id){
  if(id==='HOME'){toast('Inicio está en el Artifact aprobado.');return;}
  if(!FN[id]) return; cur=id; const sec=secOf(id);
  secsEl.innerHTML=SECS.map((s,k)=>`<button role="tab" data-sec="${k}" aria-selected="${s===sec}" ${s===sec?'':'tabindex="-1"'}>${s.t}</button>`).join('');
  scrEl.innerHTML=sec.s.map(([k,t])=>`<button data-to="${k}" aria-pressed="${k===id}">${t}</button>`).join('');
  panel.innerHTML=FN[id]()+'<div class="toast" role="status" aria-live="polite"></div>';
  panel.setAttribute('aria-label','Pantalla: '+nameOf(id));
  nTitle.textContent=sec.t+' · '+nameOf(id);
  notes.innerHTML=(RULES[id]||[]).map(r=>`<li>${r}</li>`).join('');
  errSeg.hidden=id!=='A1';
  try{localStorage.setItem('wl-f',id)}catch(e){}
}
secsEl.addEventListener('click',e=>{const b=e.target.closest('[data-sec]');if(b)go(SECS[+b.dataset.sec].s[0][0]);});
secsEl.addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;const k=SECS.indexOf(secOf(cur));const j=(k+(e.key==='ArrowRight'?1:SECS.length-1))%SECS.length;go(SECS[j].s[0][0]);secsEl.querySelector('[aria-selected="true"]').focus();});
scrEl.addEventListener('click',e=>{const b=e.target.closest('[data-to]');if(b)go(b.dataset.to);});
errSeg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{loginErr=b.dataset.e==='1';errSeg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));go('A1');}));
panel.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault();go(g.dataset.go);return;}
  const c=e.target.closest('.choices[data-single] .choice'); if(c){c.parentNode.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',x===c));return;}
  const o=e.target.closest('.opt,.fchip,.pchip'); if(o){o.setAttribute('aria-pressed',o.getAttribute('aria-pressed')!=='true');return;}
  if(e.target.closest('button')) toast('Prototipo visual: la acción no está conectada.');
});
let st='G1'; try{const v=localStorage.getItem('wl-f'); if(FN[v]) st=v;}catch(e){}
go(st);
</script>
